<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RF-EPiano</title>
  <link rel="stylesheet" href="play.css">
  <script type="module" src="play.js"></script>
</head>
<body>
  <main class="instrument" aria-labelledby="instrument-name">
    <div class="top-rail">
      <span>RackForge Instruments</span>
      <span>Reed series <b>200A</b></span>
    </div>

    <div class="console">
      <div class="grille" aria-hidden="true"></div>
      <section class="faceplate" aria-label="Instrument controls">
        <header class="nameplate">
          <div>
            <h1 id="instrument-name">RF-EPiano</h1>
            <p>Electrostatic reed piano</p>
          </div>
          <span class="badge" aria-hidden="true"><i></i>200A</span>
        </header>
        <div class="program-memory">
          <span class="program-label" aria-hidden="true">Program memory</span>
          <rf-program-select label="Program" placeholder="Search RF-EPiano programs" fit="0.72"></rf-program-select>
        </div>
        <div class="controls">
          <div class="control">
            <label for="volume">Volume</label>
            <div class="dial">
              <input id="volume" type="range" min="0" max="1" step="0.001" value="0.8" disabled>
              <div class="dial-cap" aria-hidden="true"><i></i></div>
            </div>
            <div class="readout"><span>Min</span><output for="volume" id="volume-value">80%</output><span>Max</span></div>
          </div>
          <div class="control">
            <label for="tremolo">Tremolo</label>
            <div class="dial">
              <input id="tremolo" type="range" min="0" max="1" step="0.001" value="0.5" disabled>
              <div class="dial-cap" aria-hidden="true"><i></i></div>
            </div>
            <div class="readout"><span>Off</span><output for="tremolo" id="tremolo-value">50%</output><span>Deep</span></div>
          </div>
          <div class="control">
            <label for="speaker">Speaker</label>
            <div class="dial">
              <input id="speaker" type="range" min="0" max="1" step="0.001" value="0" disabled>
              <div class="dial-cap" aria-hidden="true"><i></i></div>
            </div>
            <div class="readout"><span>Direct</span><output for="speaker" id="speaker-value">0%</output><span>Cabinet</span></div>
          </div>
        </div>
      </section>
      <div class="grille" aria-hidden="true"></div>
    </div>

    <div class="keybed" aria-hidden="true">
      <svg viewBox="0 0 840 62" preserveAspectRatio="none" focusable="false">
        <defs>
          <linearGradient id="ivory" x2="0" y2="1">
            <stop stop-color="#bdb19a"/><stop offset=".3" stop-color="#f6efdb"/>
            <stop offset=".87" stop-color="#ede2c8"/><stop offset=".9" stop-color="#c8b89b"/>
            <stop offset="1" stop-color="#e3d4b6"/>
          </linearGradient>
          <linearGradient id="ebony" x2="0" y2="1">
            <stop stop-color="#141716"/><stop offset=".77" stop-color="#333630"/>
            <stop offset="1" stop-color="#141614"/>
          </linearGradient>
          <pattern id="white-keys" width="30" height="62" patternUnits="userSpaceOnUse">
            <rect x=".6" y="0" width="28.8" height="61.5" rx="2" fill="url(#ivory)"/>
          </pattern>
          <pattern id="black-keys" width="210" height="62" patternUnits="userSpaceOnUse">
            <path d="M21 0h18v34a2 2 0 0 1-2 2H23a2 2 0 0 1-2-2zm30 0h18v34a2 2 0 0 1-2 2H53a2 2 0 0 1-2-2zm60 0h18v34a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2zm30 0h18v34a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2zm30 0h18v34a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2z" fill="url(#ebony)" stroke="#090e0b"/>
          </pattern>
        </defs>
        <rect width="840" height="62" fill="url(#white-keys)"/>
        <rect width="840" height="62" fill="url(#black-keys)"/>
      </svg>
    </div>

    <footer class="footer">
      <span>Powered by OpenWurli</span>
      <span class="status" id="status" role="status">Connecting…</span>
    </footer>
  </main>
</body>
</html>
