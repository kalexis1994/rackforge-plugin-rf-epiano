[workspace]
resolver = "3"
members = ["plugin", "vendor/openwurli-dsp"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
rackforge-plugin-sdk = { git = "https://github.com/kalexis1994/rackforge.git", rev = "7a14c68aa208290587d985d606b0dbc17600ee07" }
rackforge-plugin-runtime = { git = "https://github.com/kalexis1994/rackforge.git", rev = "7a14c68aa208290587d985d606b0dbc17600ee07" }
openwurli-dsp = { path = "vendor/openwurli-dsp", features = ["rackforge-reset"] }

[profile.release]
opt-level = 3
panic = "abort"
lto = false
